name: prepare-workbench
on:
  push:
    branches: [feat/workbench-workflows-20260909]
    paths: ['.github/workbench-patch.*', '.github/workflows/prepare-workbench.yml']
permissions:
  contents: write
concurrency:
  group: prepare-workbench
  cancel-in-progress: true
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Apply the verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/workbench-patch.1 .github/workbench-patch.2 .github/workbench-patch.3 .github/workbench-patch.4 | gzip -dc > "$RUNNER_TEMP/workbench.patch"
          echo "e8fcc2c12dd0668f34b1ba1e465217c24dfb1d59df5af32f26a44b2e65273409  $RUNNER_TEMP/workbench.patch" | sha256sum -c -
          git apply --check --unidiff-zero "$RUNNER_TEMP/workbench.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/workbench.patch"
          git diff --check
      - run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: python -m pip install . playwright==1.57.0
      - name: Run the complete Python suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          python -m unittest discover -s tests -v 2>&1 | tee browser-artifacts/python-tests.txt
          nreact demo --json > browser-artifacts/offline-demo.json
      - run: python -m playwright install --with-deps chromium
      - name: Run real Chromium workflow regressions
        shell: bash
        env:
          NREACT_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/browser -v 2>&1 | tee browser-artifacts/browser-tests.txt
      - name: Commit validated application sources and packaged assets
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workbench-patch.1 .github/workbench-patch.2 .github/workbench-patch.3 .github/workbench-patch.4
          # The runner token can publish application code. Workflow changes are
          # finalized separately through the user's authorized GitHub connection.
          git restore --source=HEAD --staged --worktree .github/workflows/browser.yml .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workbench-patch.* .gitignore README.md docs/workflows.md python/nreact/web.py python/nreact/workflows.py python/nreact/web_static tests/browser/test_workbench.py tests/test_workflows.py web/src/App.vue web/src/GraphCanvas.vue web/src/WorkflowDialog.vue web/src/graph-document.js web/tests/graph.test.js web/tests/graph-document.test.js
          git diff --cached --check
          git commit -m 'Add portable workflows and reliable canvas editing'
          git push origin HEAD:refs/heads/feat/workbench-workflows-20260909
      - name: Preserve validation logs and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-validation-${{ github.sha }}
          path: browser-artifacts/
          retention-days: 14
