name: prepare-queue
on:
  push:
    branches: [feat/run-queue-20260909]
    paths: ['.github/queue-patch.*', '.github/workflows/prepare-queue.yml']
permissions:
  contents: write
concurrency:
  group: prepare-queue
  cancel-in-progress: true
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Apply the verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/queue-patch.{0,1,2,3,4,5} | gzip -dc > "$RUNNER_TEMP/queue.patch"
          echo "5e89bc89f776a7446d263ae6038848a1cfd0b8080c04f98846a70b11f8ae462d  $RUNNER_TEMP/queue.patch" | sha256sum -c -
          git apply --check --unidiff-zero "$RUNNER_TEMP/queue.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/queue.patch"
          git diff --check
      - run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: python -m pip install . playwright==1.57.0
      - name: Run Python regressions and offline demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          python -m unittest discover -s tests -v 2>&1 | tee browser-artifacts/python-tests.txt
          nreact demo --json > browser-artifacts/offline-demo.json
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the packaged workbench in Chromium
        shell: bash
        env:
          NREACT_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/browser -v 2>&1 | tee browser-artifacts/browser-tests.txt
      - name: Commit validated sources and assets
        shell: bash
        run: |
          set -euo pipefail
          rm .github/queue-patch.{0,1,2,3,4,5}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/queue-patch.* docs/workbench.md docs/run-queue.md python/nreact/_run_store.py python/nreact/runs.py python/nreact/web.py python/nreact/web_static tests/test_queue.py tests/test_run_updates.py tests/browser/test_workbench.py web/src/App.vue web/src/api.js web/src/run-updates.js web/tests/api.test.js web/tests/run-updates.test.js
          git diff --cached --check
          git commit -m 'Add bounded run queue and incremental workbench updates'
          git push origin HEAD:refs/heads/feat/run-queue-20260909
      - name: Preserve validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-validation-${{ github.sha }}
          path: browser-artifacts/
          retention-days: 14
